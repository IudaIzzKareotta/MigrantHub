name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  DB_USER: migranthub
  DB_PASSWORD: migranthub
  DB_NAME: migranthub
  DB_PORT: 5432

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: migranthub
          POSTGRES_PASSWORD: migranthub
          POSTGRES_DB: migranthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migranthub -d migranthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: run migrations
        run: make migrate-up
        env:
          DB_HOST: localhost

      - name: test
        run: go test ./... -race
        env:
          TEST_DATABASE_URL: postgres://migranthub:migranthub@localhost:5432/migranthub?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    services:
      postgres:
        image: imresamu/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: migranthub
          POSTGRES_PASSWORD: migranthub
          POSTGRES_DB: migranthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migranthub -d migranthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: run migrations
        run: make migrate-up
        env:
          DB_HOST: localhost

      - name: build image
        run: docker build -t migranthub-api:ci .

      - name: run container and check health/ready
        run: |
          docker run -d --name api --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_USER=migranthub -e DB_PASSWORD=migranthub -e DB_NAME=migranthub \
            migranthub-api:ci

          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/ready >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          docker logs api

          if [ -z "$ok" ]; then
            echo "container never became ready"
            exit 1
          fi

          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/ready

      - name: cleanup
        if: always()
        run: docker rm -f api || true
